name: Build and Test

on:
  push:
    branches: [ master, main, develop, feature/** ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build All Modules
      run: mvn -B clean install -DskipTests
    
    - name: Run Tests
      run: mvn -B test -pl backend/common,backend/mcp-server,backend/agent-orchestrator,backend/agent-cli
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/target/surefire-reports/*.xml'

  build-plugin:
    name: Build IntelliJ Plugin
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
    
    - name: Build Plugin
      working-directory: plugins/intellij-plugin
      run: ./gradlew buildPlugin
    
    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: intellij-plugin
        path: plugins/intellij-plugin/build/distributions/*.zip

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Run Checkstyle
      run: mvn -B checkstyle:check -pl backend/common,backend/mcp-server,backend/agent-orchestrator,backend/agent-cli || true
    
    - name: Run SpotBugs
      run: mvn -B spotbugs:check -pl backend/common,backend/mcp-server,backend/agent-orchestrator,backend/agent-cli || true
