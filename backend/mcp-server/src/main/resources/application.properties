server.port=8081

spring.application.name=mcp-server

spring.codec.max-in-memory-size=10MB

mcp.allowed-directories=/workspace,/tmp,/Users
mcp.max-file-size=1048576

mcp.execution.timeout-ms=30000
mcp.execution.max-concurrent=10
mcp.execution.max-file-size-bytes=10485760
mcp.execution.max-patch-size-chars=100000

mcp.tools.filesystem.enabled=true
mcp.tools.filesystem.allowed-extensions=.java,.kt,.xml,.yml,.yaml,.json,.md,.txt,.properties

mcp.tools.shell.enabled=true
mcp.tools.shell.allowed-shells=/bin/bash,/bin/sh,/bin/zsh

mcp.tools.git.enabled=true
mcp.tools.git.auto-detect=true

mcp.tools.repo.enabled=true
mcp.tools.repo.index-on-startup=false

logging.level.com.aiagent.mcp=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
